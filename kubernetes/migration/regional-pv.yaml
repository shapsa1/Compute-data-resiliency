apiVersion: v1
kind: PersistentVolume
metadata:
  name: pets-db-regional-pv
spec:
  capacity:
    storage: 10Gi  # Must match the size of your regional disk
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: regional-pd
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/gke-train-476006/regions/us-central1/disks/pets-db-regional-disk
    fsType: ext4

